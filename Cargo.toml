[package]
name = "rust-embassy-augsburg-2026"
version = "0.1.0"
edition = "2024"
publish = false

# The firmware binary only builds for the RP2040 (`cargo b` / `cargo r`);
# plain `cargo build` / `cargo test` on the host only build the library,
# which has no hardware dependencies.
[features]
firmware = [
    "dep:cortex-m-rt",
    "dep:cyw43-pio",
    "dep:embassy-net",
    "dep:cortex-m",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "dep:embassy-executor",
    "dep:embassy-rp",
    "dep:embassy-time",
    "dep:cyw43",
    "dep:cyw43-pio",
    "dep:static_cell",
    "dep:portable-atomic",
]

[dependencies]
cortex-m-rt = { version = "0.7.5", optional = true }
defmt = { version = "1.0.1", optional = true }
defmt-rtt = { version = "1.0.0", optional = true }
panic-probe = { version = "1.0.0", optional = true, features = ["print-defmt"] }
embassy-executor = { version = "0.10.0", optional = true, features = ["defmt", "executor-thread", "platform-cortex-m"] }
embassy-rp = { version = "0.10.0", optional = true, features = [
    "defmt",
    "critical-section-impl",
    "time-driver",
    "rp2040",
] }
embassy-time = { version = "0.5.1", optional = true, features = ["defmt", "defmt-timestamp-uptime"] }
cyw43 = { version = "0.7.0", optional = true, features = ["defmt"] }
cyw43-pio = { version = "0.10.0", optional = true, features = ["defmt"] }
static_cell = { version = "2.1.0", optional = true }
# The RP2040 lacks atomic compare-and-swap, which `static_cell` needs.
portable-atomic = { version = "1.5.0", optional = true, features = ["critical-section"] }
embassy-net = { version = "0.8", optional = true, default-features = false, features = ["defmt", "dhcpv4", "medium-ethernet", "tcp"] }
cortex-m = { version = "0.7.7", optional = true }
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
rstest = "0.28.0"
test-that = { version = "0.6.0", default-features = false }

[profile.release]
debug = 2

[[bin]]
name = "blinky"
path = "src/main.rs"
test = false
required-features = ["firmware"]
